name: Collect weather data

on:
  schedule:
    # 06:00 UTC daily — after the previous day is fully final and most
    # model runs for it have settled.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # v5 of checkout and setup-node run on Node 24 themselves, which
      # clears GitHub's "Node.js 20 is deprecated" warning. node-version
      # below is separate: it's the Node our own scripts run on (24, the
      # current long-term-support line).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Fetch and merge weather data
        env:
          FORECAST_LAT: ${{ secrets.FORECAST_LAT }}
          FORECAST_LON: ${{ secrets.FORECAST_LON }}
          FORECAST_AREA_CODE: ${{ secrets.FORECAST_AREA_CODE }}
        run: node scripts/collect-weather.mjs

      - name: Commit updated history
        run: |
          git config user.name "forecast-compare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          # Only exists once the EA gauge list has been fetched successfully.
          if [ -f data/rain-gauges.json ]; then git add data/rain-gauges.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "Update weather history"
          # Precache now pushes every 20 minutes, so this push can collide
          # with it — pull the latest and try again rather than fail.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 10))
          done
          exit 1
