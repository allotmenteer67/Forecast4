# Coast map data — run by hand from the Actions tab ("Run workflow").
# Step 1: named coastal features, ways off the beach, cliffs and beaches
# (scripts/collect-coast-names.mjs) for each stretch of coast in
# scripts/coast-areas.json — St Brides Bay, and Lyme Regis to Charmouth —
# saved under data/coast/<area>/. Pick one area or "all" when running.
# Not scheduled: this data hardly ever changes, so it only needs running
# again after a fix, a new area, or local names added to
# data/coast/<area>/aliases.json.
name: coast-data

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Which stretch of coast (see scripts/coast-areas.json)"
        type: choice
        default: all
        options:
          - all
          - stbrides
          - charmouth

permissions:
  contents: write

concurrency:
  group: coast-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Collect names, ways off, cliffs and beaches
        env:
          COAST_AREA: ${{ inputs.area || 'all' }}
        run: node scripts/collect-coast-names.mjs

      - name: Commit the coast data
        # Also after a failed area, so the areas that worked are kept.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coast
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Coast data: names, ways off, cliffs, beaches"
          # precache-weather pushes every 20 minutes, so retry on a clash.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying…"
            sleep $((attempt * 10))
          done
          echo "Could not push after 5 attempts."
          exit 1
