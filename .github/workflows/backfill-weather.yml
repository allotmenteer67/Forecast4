name: Backfill weather history

on:
  schedule:
    # Nightly at 03:40 UTC (Nov 2026; was monthly). Inside the precache
    # job's quiet hours, so the extra Open-Meteo calls land when the
    # least else is fetching. A place that already has a year of history
    # only tops up its last 14 days (about 65 calls); a new place gets
    # its full year (about 2,000 calls), at most one new place a night.
    - cron: "40 3 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: backfill-weather
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Top up (or start) a year of history for every shared place
        run: node scripts/backfill-weather.mjs

      - name: Work out the shared corrections every device uses
        run: node scripts/build-shared-ffv.mjs

      - name: Commit updated history and corrections
        run: |
          git config user.name "forecast-compare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backfill/ data/shared-ffv/
          git diff --staged --quiet && exit 0
          git commit -m "Update backfill history and shared corrections"
          # Other jobs push to main every 20 minutes; rebase onto theirs.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1
