name: Precache weather

# ---- Trigger ----
# The real 20-minute clock is now a Cloudflare Worker
# (precache-trigger-worker.js), NOT GitHub's own schedule. GitHub
# treats frequent schedules as best-effort and in practice was skipping
# most of them: around 6 runs a day actually happened instead of the
# 72 the old "7,27,47 * * * *" cron asked for. Cloudflare's Cron
# Triggers fire on time, and every 20 minutes (:07/:27/:47 UTC) the
# Worker asks GitHub to run this workflow via the same
# "workflow_dispatch" mechanism as pressing "Run workflow" by hand.
#
# The schedule below is kept ONLY as a slow safety net (every 3 hours)
# in case the Worker ever stops - e.g. its GitHub token expires. It is
# not what keeps the data fresh.
#
# Budget: if you add or remove a weather location, re-check the sizing
# formula in data/precache-config.json's _readme. The interval to plug
# in is the Worker's (20 minutes), not this backup's.
on:
  workflow_dispatch:
  schedule:
    - cron: "52 */3 * * *"

# Never let two precache runs overlap. A backup run and a Worker run can
# occasionally land close together; this makes the second one wait for
# the first to finish instead of both racing to push the same file.
concurrency:
  group: precache-weather
  cancel-in-progress: false

# Only this one job needs write access, and only to push its own
# output file — kept minimal rather than granting broader repo access
# than this workflow actually uses.
permissions:
  contents: write

jobs:
  precache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the CURRENT tip of main, not the commit that existed
          # when this run was queued - matters when this run had to wait
          # behind another one (see concurrency above).
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run precache script
        run: node scripts/precache-weather.mjs

      - name: Commit updated precache file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precache-weather.json
          # --quiet + the exit-code check rather than always committing:
          # most 20-minute ticks genuinely produce byte-identical output
          # (weather barely changes minute to minute, and fishing's own
          # bucket-skip means it often writes nothing new at all) — an
          # empty commit every 20 minutes would bury the repo's real
          # history in thousands of no-op commits over time.
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Precache weather $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Other workflows (Build forecast feed, Collect weather data)
          # push to this repo too. If one of them pushed while this run
          # was working, a plain push is rejected - so pull their commit
          # in first and retry a few times. They never touch
          # precache-weather.json, so this can't clash with our change.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push attempt $attempt failed, retrying shortly..."
            sleep $((attempt * 5))
          done
          echo "Could not push after 5 attempts."
          exit 1
