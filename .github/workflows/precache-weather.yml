name: Precache weather

# Cron interval is a STATIC number here — it cannot adjust itself based
# on how many locations are in data/precache-config.json. If you add or
# remove a weather location, recompute the budget using the sizing
# formula in that config's own _readme block and update the schedule
# below by hand to match. Current setting (every 20 minutes) is sized
# for the 3 weather locations / top-4-forecasters config discussed when
# this was built — see data/precache-config.json for the actual current
# location count.
#
# Deliberately NOT "*/20 * * * *" (i.e. not :00/:20/:40). GitHub's own
# scheduling docs warn that jobs land less reliably at those round,
# popular minutes specifically, because that's when the platform is
# busiest with everyone else's scheduled jobs too — an unpopular offset
# minute is their own recommended fix, not something specific to this
# repo. ":07/:27/:47" keeps the same every-20-minutes cadence, just off
# the busy top-of-slot.
#
# GitHub's schedule is still best-effort even off the busy slots, not a
# guarantee — their docs state scheduled runs can still be delayed
# under high platform load, sometimes by 15-45+ minutes. The app's own
# freshness check (a ~30 minute threshold on the precached data's own
# dataAsOf timestamp) is sized with that drift in mind — see app.js.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  # Lets you trigger a run by hand from the Actions tab — useful for
  # testing a config change immediately rather than waiting up to 20
  # minutes for the next scheduled run.
  workflow_dispatch:

# Only this one job needs write access, and only to push its own
# output file — kept minimal rather than granting broader repo access
# than this workflow actually uses.
permissions:
  contents: write

jobs:
  precache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run precache script
        run: node scripts/precache-weather.mjs

      - name: Commit updated precache file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precache-weather.json
          # --quiet + the exit-code check rather than always committing:
          # most 20-minute ticks genuinely produce byte-identical output
          # (weather barely changes minute to minute, and fishing's own
          # bucket-skip means it often writes nothing new at all) — an
          # empty commit every 20 minutes would bury the repo's real
          # history in thousands of no-op commits over time.
          git diff --staged --quiet || git commit -m "Precache weather $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
