name: Build forecast feed

# Deliberately a SEPARATE job from precache-weather.yml and
# backfill-weather.yml, not an extra step tacked onto either of them —
# this is new, less-tested code; keeping it in its own workflow means a
# bug or a bad exit here can never block those two well-established
# jobs from committing their own output. It reads whatever
# data/precache-weather.json and data/backfill/TA7.json are already
# checked out — it does not need to run in lockstep with the run that
# wrote them, just reasonably soon after.
#
# ---- Trigger ----
# Runs automatically the moment "Precache weather" finishes, rather than
# guessing on its own independent timer. The two workflows used to run
# on separate 20-minute clocks with no relationship to each other, which
# caused two real problems: they'd occasionally fire close enough
# together to collide on the same push (see the retry loop below, kept
# as a second line of defence), and — more importantly — this workflow
# could run and find nothing new simply because its own timer happened
# to land before precache's did, leaving the feed stuck on old figures
# even though the workflow itself reported "success" every time.
# workflow_run fixes both: this only ever runs right after precache has
# genuinely finished, so it's always working from the freshest data
# precache actually has.
#
# The schedule below is kept too, purely as a backup in case the
# workflow_run trigger itself is ever missed — moved off the busy
# :00/:20/:40 slots the same way precache-weather.yml's own schedule
# was, and deliberately offset from precache's own :07/:27/:47 times so
# a backup run always has precache's latest commit already sitting
# there to read, rather than racing it.
on:
  workflow_run:
    workflows: ["Precache weather"]
    types: [completed]
  schedule:
    - cron: "17,37,57 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    # Skip a workflow_run trigger if precache itself failed - there's
    # nothing new to build from, and the script's own "no change to
    # commit" check further down would just make this a no-op run
    # anyway, so better not to run it at all. A schedule or manual
    # trigger (no workflow_run info attached) always proceeds normally.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build forecast.json
        run: node scripts/build-forecast-feed.mjs

      # This job can still occasionally land close to precache-weather.yml's
      # own commit (a manual trigger of either one, for instance), so the
      # retry loop stays as a second line of defence even now that the
      # normal case is event-driven rather than a race between two timers.
      #
      # Fixed by retrying: on a rejected push, pull down whatever the
      # other run just committed, put this run's freshly-built
      # forecast.json back on top of it, and try again. forecast.json is
      # a fully regenerated snapshot each run, never something to merge
      # line-by-line, so "take the latest commit, then overwrite the one
      # file this job owns with what was just built" is always the right
      # resolution — there's no meaningful conflict to resolve by hand.
      - name: Commit updated forecast feed
        run: |
          git config user.name "forecast-compare-bot"
          git config user.email "actions@users.noreply.github.com"

          # Keep a copy of this run's freshly-built file somewhere a
          # later `git reset --hard` in the retry loop below can't touch.
          cp data/forecast.json /tmp/forecast.json

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/forecast.json data/forecast.json
            git add data/forecast.json

            if git diff --staged --quiet; then
              echo "No change to commit — another run already pushed the same result."
              exit 0
            fi

            git commit -m "Update forecast feed"

            if git push; then
              echo "Pushed successfully on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt (another run committed first) — retrying..."
            sleep $((RANDOM % 10 + 5))
          done

          echo "Failed to push after several retries — giving up this run."
          exit 1
